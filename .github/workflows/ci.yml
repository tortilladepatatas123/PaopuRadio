name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # necesario solo para adjuntar el .ipa a un Release en tags v*

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.x"

      - name: Instalar herramientas
        run: brew install xcodegen swiftlint

      - name: Generar proyecto
        run: xcodegen generate

      - name: Lint
        run: swiftlint --strict

      - name: Pruebas en simulador
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Simulador: $DEVICE"
          xcodebuild test \
            -project PaopuRadio.xcodeproj \
            -scheme PaopuRadio \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Compilar para dispositivo (sin firmar)
        run: |
          xcodebuild build \
            -project PaopuRadio.xcodeproj \
            -scheme PaopuRadio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PaopuRadio.app Payload/
          zip -qry PaopuRadio.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PaopuRadio-ipa
          path: PaopuRadio.ipa

      - name: Adjuntar al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PaopuRadio.ipa
